<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>

  <!-- Top-left subtle HUD marker -->
  <path d="M 6 12 L 6 6 L 12 6" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <!-- Bottom-right subtle HUD marker -->
  <path d="M 58 52 L 58 58 L 52 58" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>

  <!-- Modern AR Monogram -->
  <text 
    x="30" 
    y="42" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Space Mono', sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="-0.5px" 
    fill="#ffffff" 
    text-anchor="middle"
    filter="url(#glow)"
  >AR</text>

  <!-- Glowing Active Status Dot / Terminal Prompt -->
  <circle cx="50" cy="40" r="3.2" fill="#ffffff" filter="url(#glow)"/>
</svg>
